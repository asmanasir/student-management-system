{% extends "base.html" %}
{% block title %}Students{% endblock %}
{% block content %}
<h1>Students</h1>

<form method="get" action="{{ url_for('students.student_list') }}">
  <label>Part of a name <input name="q" value="{{ q|default('') }}"></label>
  <button>Search</button>
</form>

<table>
  <tr><th>#</th><th>Name</th><th>Class</th></tr>
  {% for s in students %}
    <tr>
      <td>{{ loop.index }}</td>
      <td><a href="{{ url_for('students.student_detail', student_id=s.student_id) }}">{{ s.first_name }} {{ s.last_name }}</a></td>
      <td>{{ s.class_name }}</td>
    </tr>
  {% else %}
    <tr><td colspan="3">No students found.</td></tr>
  {% endfor %}
</table>

<p>{{ students|length }} students</p>
{% endblock %}
