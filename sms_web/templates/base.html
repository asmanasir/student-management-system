<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{% endblock %} | SMS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('students.student_list') }}">Students</a>
    <a href="{{ url_for('classes.class_list') }}">Classes</a>
    <a href="{{ url_for('about') }}">About</a>
    <a ref="{{ url_for('about') }}">Contact me </a>
  </nav>
  <main>
    {# Messages from flash() appear here (Part 4) #}
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}

    {# Each page puts its own content here #}
    {% block content %}{% endblock %}
  </main>
  <footer>Student Management System</footer>
</body>
</html>
