{% extends "base.html" %}
{% block title %}Add a student{% endblock %}
{% block content %}
<h1>Add a student</h1>
<form method="post" action="{{ url_for('students.student_new') }}">
  <p><label for="first_name">First name</label><br>
     <input id="first_name" name="first_name" required></p>
  <p><label for="last_name">Last name</label><br>
     <input id="last_name" name="last_name" required></p>
  <p><label for="email">Email</label><br>
     <input id="email" name="email" type="email" required></p>
  <p><label for="class_name">Class</label><br>
     <select id="class_name" name="class_name">
       <option value="2A">2A</option>
       <option value="2B">2B</option>
     </select></p>
  <button type="submit">Save student</button>
</form>
{% endblock %}
